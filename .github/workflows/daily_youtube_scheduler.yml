name: Daily Autonomous YouTube Scheduler (2026 - 2030)

on:
  schedule:
    # Runs every day at 00:00 UTC (5:30 AM IST) automatically
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target release date (YYYY-MM-DD, e.g. 2026-09-27). Leave blank for next day.'
        required: false
        default: ''
      channel:
        description: 'Channel folder to run'
        required: true
        default: 'TigerVlogs-2026'

jobs:
  run-daily-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp edge-tts google-api-python-client google-auth-oauthlib google-auth-httplib2 gspread requests

      - name: Restore Channel Credentials
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'TigerVlogs-2026' }}"
          mkdir -p "channels/${CHANNEL}"
          
          # Restore from GitHub Secrets if configured
          if [ -n "${{ secrets.YOUTUBE_TOKEN_JSON }}" ]; then
            echo "${{ secrets.YOUTUBE_TOKEN_JSON }}" > "channels/${CHANNEL}/token.json"
            echo "Restored token.json from GitHub Secrets"
          fi
          if [ -n "${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}" ]; then
            echo "${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}" > "channels/${CHANNEL}/youtube_client_secret.json"
            echo "Restored youtube_client_secret.json from GitHub Secrets"
          fi

      - name: Execute Daily Batch Runner
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'TigerVlogs-2026' }}"
          TARGET_DATE="${{ github.event.inputs.target_date }}"
          echo "Running daily scheduler for channel: ${CHANNEL}"
          python "channels/${CHANNEL}/scheduler.py" ${TARGET_DATE}

      - name: Commit State / Logs
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Autonomous Scheduler"
          git add -A
          git diff --staged --quiet || (git commit -m "chore: record automated daily batch run [skip ci]" && git push)
