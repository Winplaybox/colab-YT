name: AllTrainReels Autonomous Scheduler

on:
  schedule:
    # Runs Daily at 13:00 UTC (6:30 PM IST)
    # Renders 4K/8K 9:16 portrait train short and schedules to go live daily at 6:30 PM IST!
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      story_number:
        description: 'Episode number to produce and schedule (1 - 30). Leave empty to use next from state.json'
        required: false
        default: ''
      quality:
        description: 'Output quality: 4k (2160x3840), 8k (4320x7680), or 1080p'
        required: false
        default: '4k'
      immediate:
        description: 'Publish immediately as Public? (true / false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  # =========================================================================
  # STAGE 1: Asset Preparation & Narration Synthesis
  # =========================================================================
  prepare-assets:
    name: "Stage 1: Generate Train Visual Assets & Story"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install edge-tts requests huggingface_hub pillow static-ffmpeg
          fi

      - name: Pre-Generate Train Story & Image Assets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          EP_INPUT="${{ github.event.inputs.story_number }}"
          python -c "
          import sys, os, json
          sys.path.insert(0, 'channels/AllTrainReels')
          from story_generator import get_or_create_story
          from image_generator import ensure_story_assets

          ep_num = int('$EP_INPUT') if '$EP_INPUT'.isdigit() else None
          if not ep_num:
              try:
                  with open('channels/AllTrainReels/state.json', 'r') as f:
                      st = json.load(f)
                      ep_num = st.get('current_story_number', 1)
              except Exception:
                  ep_num = 1

          print(f'Stage 1: Pre-caching assets for AllTrainReels Episode #{ep_num}...')
          story = get_or_create_story(ep_num)
          ensure_story_assets(ep_num)
          print('✅ Railway assets generated.')
          "

      - name: Upload Prepared Assets as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alltrainreels-assets
          path: |
            channels/AllTrainReels/stories/
          if-no-files-found: ignore
          retention-days: 1

  # =========================================================================
  # STAGE 2: 4K/8K Video Rendering & YouTube Scheduling
  # =========================================================================
  render-and-schedule:
    name: "Stage 2: 4K/8K Composite & YouTube Upload"
    needs: prepare-assets
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Global Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install yt-dlp edge-tts google-api-python-client google-auth-oauthlib google-auth-httplib2 requests static-ffmpeg huggingface_hub pillow
          fi

      - name: Download Prepared Assets from Stage 1
        uses: actions/download-artifact@v4
        with:
          name: alltrainreels-assets
          path: channels/AllTrainReels/stories/

      - name: Restore AllTrainReels Credentials
        env:
          TRAIN_TOKEN: ${{ secrets.ALLTRAINREELS_TOKEN_JSON }}
          FALLBACK_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TRAIN_SECRET: ${{ secrets.ALLTRAINREELS_CLIENT_SECRET_JSON }}
          FALLBACK_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          CHANNEL_DIR="channels/AllTrainReels"
          mkdir -p "${CHANNEL_DIR}"

          TOKEN_DATA="${TRAIN_TOKEN:-$FALLBACK_TOKEN}"
          if [ -n "$TOKEN_DATA" ]; then
            printf "%s" "$TOKEN_DATA" > "${CHANNEL_DIR}/token.json"
            echo "Installed AllTrainReels YouTube OAuth token."
          fi

          SECRET_DATA="${TRAIN_SECRET:-$FALLBACK_SECRET}"
          if [ -n "$SECRET_DATA" ]; then
            printf "%s" "$SECRET_DATA" > "${CHANNEL_DIR}/youtube_client_secret.json"
            echo "Installed AllTrainReels YouTube client secret."
          fi

      - name: Execute 4K/8K AllTrainReels Production & Scheduling
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          ALLTRAINREELS_TOKEN_JSON: ${{ secrets.ALLTRAINREELS_TOKEN_JSON }}
          ALLTRAINREELS_CLIENT_SECRET_JSON: ${{ secrets.ALLTRAINREELS_CLIENT_SECRET_JSON }}
        run: |
          STORY_NUM="${{ github.event.inputs.story_number }}"
          QUALITY="${{ github.event.inputs.quality || '4k' }}"
          IMMEDIATE="${{ github.event.inputs.immediate }}"

          IMM_FLAG=""
          if [ "$IMMEDIATE" = "true" ]; then
            IMM_FLAG="--immediate"
          fi

          echo "🚀 Triggering AllTrainReels Production at ${QUALITY}..."
          if [ -n "$STORY_NUM" ]; then
            python "channels/AllTrainReels/scheduler.py" "$STORY_NUM" "$QUALITY" $IMM_FLAG
          else
            python "channels/AllTrainReels/scheduler.py" "" "$QUALITY" $IMM_FLAG
          fi

      - name: Upload Output Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-train-reels-episodes
          path: |
            channels/AllTrainReels/output/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit State & Releases
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "AllTrainReels Autonomous Bot"
          git add channels/AllTrainReels/state.json channels/AllTrainReels/stories/
          git diff --staged --quiet || git commit -m "chore(AllTrainReels): automated episode release [skip ci]"
          git pull --rebase origin main || true
          git push || echo "Push skipped or no new commits to push."
