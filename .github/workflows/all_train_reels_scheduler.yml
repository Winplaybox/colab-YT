name: AllTrainReels Autonomous Scheduler

on:
  schedule:
    # Runs Daily at 13:00 UTC (6:30 PM IST)
    # Renders 1080p/4K 9:16 portrait train short and schedules to go live daily at 6:30 PM IST!
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      story_number:
        description: 'Episode number to produce and schedule (1 - 30). Leave empty to use next from state.json'
        required: false
        default: ''
      quality:
        description: 'Output quality: 1080p (fast & efficient), 4k (2160x3840), or 8k (4320x7680)'
        required: false
        default: '1080p'
      immediate:
        description: 'Publish immediately as Public? (true / false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: all-train-reels
  cancel-in-progress: false

jobs:
  # =========================================================================
  # STAGE 1: Asset Preparation & Narration Synthesis
  # =========================================================================
  prepare-assets:
    name: "Stage 1: Generate Train Visual Assets & Story"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install edge-tts requests huggingface_hub pillow static-ffmpeg google-genai openai anthropic
          fi

      - name: Pre-Generate Train Story & Image Assets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          STORY_NUM="${{ github.event.inputs.story_number }}"
          python -c "
          import sys, os
          sys.path.insert(0, 'channels/AllTrainReels')
          from story_generator import get_or_create_story
          from image_generator import ensure_story_assets

          s_num = int('$STORY_NUM') if '$STORY_NUM'.isdigit() else None
          if not s_num:
              import json
              try:
                  with open('channels/AllTrainReels/state.json', 'r') as f:
                      st = json.load(f)
                      s_num = st.get('current_story_number', 1)
              except Exception:
                  s_num = 1

          print(f'Stage 1: Pre-caching visual assets for AllTrainReels Story #{s_num}...')
          story = get_or_create_story(s_num)
          ensure_story_assets(s_num)
          print('✅ AllTrainReels visual assets pre-cached successfully.')
          "

      - name: Upload Prepared Train Assets
        uses: actions/upload-artifact@v4
        with:
          name: all-train-reels-assets
          path: |
            channels/AllTrainReels/stories/assets/
          if-no-files-found: ignore
          retention-days: 1

  # =========================================================================
  # STAGE 2: Video Composite & YouTube Scheduling
  # =========================================================================
  render-and-schedule:
    name: "Stage 2: Video Composite & YouTube Upload"
    needs: prepare-assets
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Global Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install yt-dlp edge-tts google-api-python-client google-auth-oauthlib google-auth-httplib2 requests static-ffmpeg huggingface_hub pillow google-genai openai anthropic
          fi

      - name: Download Prepared Assets from Stage 1
        uses: actions/download-artifact@v4
        with:
          name: all-train-reels-assets
          path: channels/AllTrainReels/stories/

      - name: Restore AllTrainReels Credentials
        env:
          TRAIN_TOKEN: ${{ secrets.ALLTRAINREELS_TOKEN_JSON }}
          FALLBACK_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TRAIN_SECRET: ${{ secrets.ALLTRAINREELS_CLIENT_SECRET_JSON }}
          FALLBACK_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          CHANNEL_DIR="channels/AllTrainReels"
          mkdir -p "${CHANNEL_DIR}"

          TOKEN_DATA="${TRAIN_TOKEN:-$FALLBACK_TOKEN}"
          if [ -n "$TOKEN_DATA" ]; then
            printf "%s" "$TOKEN_DATA" > "${CHANNEL_DIR}/token.json"
            echo "Installed AllTrainReels YouTube OAuth token."
          fi

          SECRET_DATA="${TRAIN_SECRET:-$FALLBACK_SECRET}"
          if [ -n "$SECRET_DATA" ]; then
            printf "%s" "$SECRET_DATA" > "${CHANNEL_DIR}/youtube_client_secret.json"
            echo "Installed AllTrainReels YouTube client secret."
          fi

      - name: Validate AllTrainReels OAuth before rendering
        run: python scripts/channel_oauth_preflight.py --channel all-train

      - name: Check installed Python dependency consistency
        run: python -m pip check

      - name: Execute AllTrainReels Production & Scheduling
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YT_BRAIN: ${{ vars.YT_BRAIN || 'on' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          ALLTRAINREELS_TOKEN_JSON: ${{ secrets.ALLTRAINREELS_TOKEN_JSON }}
          ALLTRAINREELS_CLIENT_SECRET_JSON: ${{ secrets.ALLTRAINREELS_CLIENT_SECRET_JSON }}
        run: |
          STORY_NUM="${{ github.event.inputs.story_number }}"
          QUALITY="${{ github.event.inputs.quality || '1080p' }}"
          IMMEDIATE="${{ github.event.inputs.immediate }}"

          IMM_FLAG=""
          if [ "$IMMEDIATE" = "true" ]; then
            IMM_FLAG="--immediate"
          fi

          echo "🚀 Triggering AllTrainReels Production at ${QUALITY}..."
          if [ -n "$STORY_NUM" ]; then
            python "channels/AllTrainReels/scheduler.py" "$STORY_NUM" "$QUALITY" $IMM_FLAG
          else
            python "channels/AllTrainReels/scheduler.py" "" "$QUALITY" $IMM_FLAG
          fi

      - name: Upload Output Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-train-reels-episodes
          path: |
            channels/AllTrainReels/output/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit State & Releases
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "AllTrainReels Autonomous Bot"
          git add channels/AllTrainReels/state.json channels/AllTrainReels/stories/
          if ! git diff --staged --quiet; then
            git commit -m "chore(AllTrainReels): automated episode release [skip ci]"
            pushed=0
            for i in 1 2 3 4 5; do
              echo "Push attempt $i..."
              git pull --rebase origin main && git push && pushed=1 && break
              sleep $((i * 3))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Failed to push AllTrainReels state after 5 attempts!"
              exit 1
            fi
          else
            echo "No changes to state."
          fi
