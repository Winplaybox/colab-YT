name: IndianHorrorTapes Autonomous Scheduler

on:
  schedule:
    # Runs Wednesday and Sunday at 14:00 UTC (7:30 PM IST)
    # Renders 8K 9:16 portrait horror video and auto-schedules to go live at 9:00 PM IST (15:30 UTC)!
    - cron: '0 14 * * 0,3'
  workflow_dispatch:
    inputs:
      story_number:
        description: 'Story number to produce and schedule (1 - 103). Leave empty to use next from state.json'
        required: false
        default: ''
      quality:
        description: 'Output quality: 8k (4320x7680), 4k (2160x3840), or 1080p (1080x1920)'
        required: false
        default: '8k'
      immediate:
        description: 'Publish immediately as Public? (true / false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  produce-and-upload:
    name: Generate & Schedule IndianHorrorTapes Episode
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Global Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install yt-dlp edge-tts google-api-python-client google-auth-oauthlib google-auth-httplib2 requests static-ffmpeg huggingface_hub
          fi

      - name: Restore IndianHorrorTapes Credentials
        env:
          HORROR_TOKEN: ${{ secrets.INDIANHORRORTAPES_TOKEN_JSON }}
          HORROR_SECRET: ${{ secrets.INDIANHORRORTAPES_CLIENT_SECRET_JSON }}
          FALLBACK_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          CHANNEL_DIR="channels/IndianHorrorTapes"
          mkdir -p "${CHANNEL_DIR}"

          if [ -n "$HORROR_TOKEN" ]; then
            printf "%s" "$HORROR_TOKEN" > "${CHANNEL_DIR}/token.json"
            echo "Installed IndianHorrorTapes YouTube OAuth token."
          fi

          SECRET_DATA="${HORROR_SECRET:-$FALLBACK_SECRET}"
          if [ -n "$SECRET_DATA" ]; then
            printf "%s" "$SECRET_DATA" > "${CHANNEL_DIR}/youtube_client_secret.json"
            echo "Installed YouTube client secret."
          fi

      - name: Execute IndianHorrorTapes Production & Scheduling
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          INDIANHORRORTAPES_TOKEN_JSON: ${{ secrets.INDIANHORRORTAPES_TOKEN_JSON }}
        run: |
          STORY_NUM="${{ github.event.inputs.story_number }}"
          QUALITY="${{ github.event.inputs.quality }}"
          IMMEDIATE="${{ github.event.inputs.immediate }}"

          QUAL_ARG="${QUALITY:-8k}"
          IMM_FLAG=""
          if [ "$IMMEDIATE" = "true" ]; then
            IMM_FLAG="--immediate"
          fi

          echo "🚀 Triggering IndianHorrorTapes Production at ${QUAL_ARG}..."
          if [ -n "$STORY_NUM" ]; then
            python "channels/IndianHorrorTapes/scheduler.py" "$STORY_NUM" "$QUAL_ARG" $IMM_FLAG
          else
            python "channels/IndianHorrorTapes/scheduler.py" "" "$QUAL_ARG" $IMM_FLAG
          fi

      - name: Commit State / Logs
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "IndianHorrorTapes Autonomous Bot"
          git add -A
          git diff --staged --quiet || git commit -m "chore(IndianHorrorTapes): automated episode release [skip ci]"
          git push || echo "Push skipped or no new commits to push."
