# One-time copy of YouTube OAuth secrets from this repo into Winplaybox/Remotion (so Remotion can schedule uploads).
# Secret values never leave GitHub and are never printed: each one is piped straight into `gh secret set`.
#
# Setup (once):
#   1. github.com/settings/personal-access-tokens -> Fine-grained token
#      Repository access: Only Winplaybox/Remotion · Permissions: Secrets = Read and write. Copy it.
#   2. This repo -> Settings -> Secrets and variables -> Actions -> New secret: REMOTION_SECRETS_PAT = <token>
#   3. Actions -> "Copy YT secrets to Remotion" -> Run workflow. Delete the PAT afterwards if you like.
name: Copy YT secrets to Remotion
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report which secrets would be copied"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.REMOTION_SECRETS_PAT }}
      DRY_RUN: ${{ inputs.dry_run }}
      TARGET: Winplaybox/Remotion
      INDIANHORRORTAPES_TOKEN_JSON: ${{ secrets.INDIANHORRORTAPES_TOKEN_JSON }}
      INDIANHORRORTAPES_CLIENT_SECRET_JSON: ${{ secrets.INDIANHORRORTAPES_CLIENT_SECRET_JSON }}
      ALLTRAINREELS_TOKEN_JSON: ${{ secrets.ALLTRAINREELS_TOKEN_JSON }}
      ALLTRAINREELS_CLIENT_SECRET_JSON: ${{ secrets.ALLTRAINREELS_CLIENT_SECRET_JSON }}
      YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
      MINDNEST_ALL_TOKENS_JSON: ${{ secrets.MINDNEST_ALL_TOKENS_JSON }}
      MINDNEST_CLIENT_SECRET_JSON: ${{ secrets.MINDNEST_CLIENT_SECRET_JSON }}
      MINDNEST_TOKEN_AR_JSON: ${{ secrets.MINDNEST_TOKEN_AR_JSON }}
      MINDNEST_TOKEN_DE_JSON: ${{ secrets.MINDNEST_TOKEN_DE_JSON }}
      MINDNEST_TOKEN_EN_JSON: ${{ secrets.MINDNEST_TOKEN_EN_JSON }}
      MINDNEST_TOKEN_ES_JSON: ${{ secrets.MINDNEST_TOKEN_ES_JSON }}
      MINDNEST_TOKEN_FIL_JSON: ${{ secrets.MINDNEST_TOKEN_FIL_JSON }}
      MINDNEST_TOKEN_FR_JSON: ${{ secrets.MINDNEST_TOKEN_FR_JSON }}
      MINDNEST_TOKEN_HI_JSON: ${{ secrets.MINDNEST_TOKEN_HI_JSON }}
      MINDNEST_TOKEN_JA_JSON: ${{ secrets.MINDNEST_TOKEN_JA_JSON }}
      MINDNEST_TOKEN_KO_JSON: ${{ secrets.MINDNEST_TOKEN_KO_JSON }}
      MINDNEST_TOKEN_PT_JSON: ${{ secrets.MINDNEST_TOKEN_PT_JSON }}
      MINDNEST_TOKEN_VI_JSON: ${{ secrets.MINDNEST_TOKEN_VI_JSON }}
    steps:
      - name: Check PAT
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Add the REMOTION_SECRETS_PAT secret first (see the comment at the top of this workflow)"; exit 1; fi
      - name: Copy
        shell: python
        run: |
          import json, os, subprocess, sys

          env = lambda k: (os.environ.get(k) or "").strip()
          bundle = {}
          if env("MINDNEST_ALL_TOKENS_JSON"):
              try: bundle = json.loads(env("MINDNEST_ALL_TOKENS_JSON"))
              except json.JSONDecodeError: print("! MINDNEST_ALL_TOKENS_JSON is not JSON, ignoring it")

          def mindnest(lang):
              v = bundle.get(lang) if isinstance(bundle, dict) else None
              if v: return v if isinstance(v, str) else json.dumps(v)
              return env(f"MINDNEST_TOKEN_{lang.upper()}_JSON")

          plan = [
              ("YT_TOKEN_INDIAN_HORROR_TAPES", env("INDIANHORRORTAPES_TOKEN_JSON")),
              ("YT_TOKEN_INDIAN_HORROR_TAPES_CLIENT", env("INDIANHORRORTAPES_CLIENT_SECRET_JSON") or env("YOUTUBE_CLIENT_SECRET_JSON")),
              ("YT_TOKEN_ALLTRAINREELS", env("ALLTRAINREELS_TOKEN_JSON")),
              ("YT_TOKEN_ALLTRAINREELS_CLIENT", env("ALLTRAINREELS_CLIENT_SECRET_JSON") or env("YOUTUBE_CLIENT_SECRET_JSON")),
          ]
          for lang in ["hi", "es", "ar", "de", "ja", "ko", "fil", "en", "fr", "pt", "vi"]:
              plan.append((f"YT_TOKEN_MINDNEST_{lang.upper()}", mindnest(lang)))
              plan.append((f"YT_TOKEN_MINDNEST_{lang.upper()}_CLIENT", env("MINDNEST_CLIENT_SECRET_JSON") or env("YOUTUBE_CLIENT_SECRET_JSON")))

          copied, missing, failed = [], [], []
          for name, value in plan:
              if not value: missing.append(name); continue
              try: json.loads(value)
              except json.JSONDecodeError: failed.append(f"{name} (source is not JSON)"); continue
              if os.environ.get("DRY_RUN") == "true": copied.append(name); continue
              r = subprocess.run(["gh", "secret", "set", name, "--repo", os.environ["TARGET"]], input=value.encode(), capture_output=True)
              (copied if r.returncode == 0 else failed).append(name if r.returncode == 0 else f"{name}: {r.stderr.decode().strip()}")
          verb = "would copy" if os.environ.get("DRY_RUN") == "true" else "copied"
          print(f"{verb} ({len(copied)}):", *copied, sep="\n  ✔ ")
          if missing: print(f"not set here ({len(missing)}):", *missing, sep="\n  · ")
          if failed: print(f"failed ({len(failed)}):", *failed, sep="\n  ✘ "); sys.exit(1)
