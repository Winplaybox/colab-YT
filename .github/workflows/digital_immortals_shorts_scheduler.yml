name: DigitalImmortals Daily Shorts Scheduler

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to YouTube?"
        default: "true"
        type: choice
        options: ["true", "false"]
      privacy:
        description: "Upload privacy (public publishes automatically)"
        default: "public"
        type: choice
        options: ["public", "private", "unlisted"]

permissions:
  contents: write

concurrency:
  group: digital-immortals-shorts
  cancel-in-progress: false

jobs:
  make-short:
    name: "Produce & Upload Daily Mythology Short"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install System Dependencies (FFmpeg & Global Fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install -r channels/DigitalImmortals/shorts/requirements.txt

      - name: Produce Today's Mythology Short
        working-directory: channels/DigitalImmortals/shorts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DIGITALIMMORTALS_TOKEN_JSON: ${{ secrets.DIGITALIMMORTALS_TOKEN_JSON }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'gemini' }}
          UPLOAD: ${{ github.event.inputs.upload || 'true' }}
          PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
        run: python -m pipeline.main

      - name: Upload Output Video & Script Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: di-short-${{ github.run_id }}
          path: |
            channels/DigitalImmortals/shorts/out/*/*.mp4
            channels/DigitalImmortals/shorts/out/*/script.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit Topic History
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "DigitalImmortals Autonomous Bot"
          git add channels/DigitalImmortals/shorts/data/history.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(DigitalImmortals): advance daily shorts history [skip ci]"
            pushed=0
            for i in 1 2 3 4 5; do
              echo "Push attempt $i..."
              git pull --rebase origin main && git push && pushed=1 && break
              sleep $((i * 3))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Failed to push history after 5 attempts!"
              exit 1
            fi
          else
            echo "No changes to history.json."
          fi
