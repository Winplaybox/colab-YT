name: TigerVlogs-2026 Daily Scheduler (2026 - 2030)

on:
  schedule:
    # Dedicated daily cron for TigerVlogs-2026 at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target release date (YYYY-MM-DD, e.g. 2026-09-27). Leave blank for next day.'
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  run-tigervlogs-batch:
    name: Generate & Schedule TigerVlogs-2026
    # Change to 'self-hosted' for 100% unlimited free private runs on your local machine
    # Or keep 'ubuntu-latest' to run on GitHub cloud servers
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11 (Cloud Runner)
        if: runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (Linux Cloud)
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          else
            echo "Skipping apt-get on self-hosted / Windows environment."
          fi

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install yt-dlp edge-tts google-api-python-client google-auth-oauthlib google-auth-httplib2 gspread requests pandas static-ffmpeg
          fi

      - name: Restore TigerVlogs-2026 Credentials
        env:
          TIGERVLOGS_TOKEN: ${{ secrets.TIGERVLOGS_TOKEN_JSON }}
          FALLBACK_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TIGERVLOGS_SECRET: ${{ secrets.TIGERVLOGS_CLIENT_SECRET_JSON }}
          FALLBACK_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          CHANNEL_DIR="channels/TigerVlogs-2026"
          mkdir -p "${CHANNEL_DIR}"

          TOKEN_DATA="${TIGERVLOGS_TOKEN:-$FALLBACK_TOKEN}"
          SECRET_DATA="${TIGERVLOGS_SECRET:-$FALLBACK_SECRET}"

          if [ -n "$TOKEN_DATA" ]; then
            printf "%s" "$TOKEN_DATA" > "${CHANNEL_DIR}/token.json"
            echo "Successfully restored token.json from GitHub Secrets"
          elif [ -f "${CHANNEL_DIR}/token.json" ]; then
            echo "Found existing local token.json on self-hosted runner"
          else
            echo "::error::token.json not found! Add TIGERVLOGS_TOKEN_JSON to GitHub Secrets."
            exit 1
          fi

          if [ -n "$SECRET_DATA" ]; then
            printf "%s" "$SECRET_DATA" > "${CHANNEL_DIR}/youtube_client_secret.json"
          fi

      - name: Execute TigerVlogs-2026 Daily Batch
        run: |
          TARGET_DATE="${{ github.event.inputs.target_date }}"
          echo "Executing TigerVlogs-2026 Daily Batch Runner..."
          if [ -n "$TARGET_DATE" ]; then
            python "channels/TigerVlogs-2026/scheduler.py" "$TARGET_DATE"
          else
            python "channels/TigerVlogs-2026/scheduler.py"
          fi

      - name: Commit State / Logs
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "TigerVlogs-2026 Autonomous Bot"
          git add -A
          git diff --staged --quiet || git commit -m "chore(TigerVlogs-2026): automated daily upload run [skip ci]"
          git push || echo "Push skipped or no new commits to push."
