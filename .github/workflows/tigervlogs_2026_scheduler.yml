name: TigerVlogs-2026 Daily Scheduler (2026 - 2030)

on:
  schedule:
    # Dedicated daily cron for TigerVlogs-2026 at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target release date (YYYY-MM-DD, e.g. 2026-09-27). Leave blank for next day.'
        required: false
        default: ''

jobs:
  run-tigervlogs-batch:
    name: Generate & Schedule TigerVlogs-2026
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp edge-tts google-api-python-client google-auth-oauthlib google-auth-httplib2 gspread requests

      - name: Restore TigerVlogs-2026 Credentials
        run: |
          CHANNEL_DIR="channels/TigerVlogs-2026"
          mkdir -p "${CHANNEL_DIR}"
          
          # Prioritize channel-specific secret, fallback to general secret
          TOKEN_SECRET="${{ secrets.TIGERVLOGS_TOKEN_JSON || secrets.YOUTUBE_TOKEN_JSON }}"
          CLIENT_SECRET="${{ secrets.TIGERVLOGS_CLIENT_SECRET_JSON || secrets.YOUTUBE_CLIENT_SECRET_JSON }}"
          
          if [ -n "$TOKEN_SECRET" ]; then
            echo "$TOKEN_SECRET" > "${CHANNEL_DIR}/token.json"
            echo "Restored token.json for TigerVlogs-2026"
          fi
          if [ -n "$CLIENT_SECRET" ]; then
            echo "$CLIENT_SECRET" > "${CHANNEL_DIR}/youtube_client_secret.json"
            echo "Restored youtube_client_secret.json for TigerVlogs-2026"
          fi

      - name: Execute TigerVlogs-2026 Daily Batch
        run: |
          TARGET_DATE="${{ github.event.inputs.target_date }}"
          echo "Executing TigerVlogs-2026 Daily Batch Runner..."
          python "channels/TigerVlogs-2026/scheduler.py" ${TARGET_DATE}

      - name: Commit State / Logs
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "TigerVlogs-2026 Autonomous Bot"
          git add -A
          git diff --staged --quiet || (git commit -m "chore(TigerVlogs-2026): automated daily upload run [skip ci]" && git push)
