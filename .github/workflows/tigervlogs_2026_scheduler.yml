name: TigerVlogs-2026 Daily Scheduler (2026 - 2030)

on:
  schedule:
    # Dedicated daily cron for TigerVlogs-2026 at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target release date (YYYY-MM-DD, e.g. 2026-09-27). Leave blank for next day.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: tigervlogs-2026
  cancel-in-progress: false

jobs:
  # =========================================================================
  # STAGE 1: Media Asset Preparation & Audio Synthesizer
  # =========================================================================
  prepare-assets:
    name: "Stage 1: Generate Food Assets & TTS Speech"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install yt-dlp edge-tts requests static-ffmpeg pillow anthropic google-genai openai
          fi

      - name: Pre-Cache Media & Audio Narration
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          TARGET_DATE="${{ github.event.inputs.target_date }}"
          python -c "
          import sys, os
          sys.path.insert(0, 'channels/TigerVlogs-2026')
          from datetime import datetime, timedelta

          t_date = '$TARGET_DATE'
          if not t_date:
              t_date = (datetime.now() + timedelta(days=1)).strftime('%Y-%m-%d')
          print(f'Stage 1: Pre-caching media for TigerVlogs target date: {t_date}')
          "

  # =========================================================================
  # STAGE 2: 1080p Composite & YouTube Upload
  # =========================================================================
  render-and-schedule:
    name: "Stage 2: 1080p Render & Daily 2-Video Scheduling"
    needs: prepare-assets
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Global Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install yt-dlp edge-tts google-api-python-client google-auth-oauthlib google-auth-httplib2 gspread requests pandas static-ffmpeg pillow anthropic google-genai openai
          fi

      - name: Restore TigerVlogs-2026 Credentials
        env:
          TIGERVLOGS_TOKEN: ${{ secrets.TIGERVLOGS_TOKEN_JSON }}
          FALLBACK_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TIGERVLOGS_SECRET: ${{ secrets.TIGERVLOGS_CLIENT_SECRET_JSON }}
          FALLBACK_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          CHANNEL_DIR="channels/TigerVlogs-2026"
          mkdir -p "${CHANNEL_DIR}"

          TOKEN_DATA="${TIGERVLOGS_TOKEN:-$FALLBACK_TOKEN}"
          SECRET_DATA="${TIGERVLOGS_SECRET:-$FALLBACK_SECRET}"

          if [ -n "$TOKEN_DATA" ]; then
            printf "%s" "$TOKEN_DATA" > "${CHANNEL_DIR}/token.json"
            echo "Successfully restored token.json from GitHub Secrets"
          else
            echo "::error::Neither TIGERVLOGS_TOKEN_JSON nor YOUTUBE_TOKEN_JSON was found in GitHub Secrets!"
            exit 1
          fi

          if [ -n "$SECRET_DATA" ]; then
            printf "%s" "$SECRET_DATA" > "${CHANNEL_DIR}/youtube_client_secret.json"
            echo "Successfully restored youtube_client_secret.json"
          fi

      - name: Validate TigerVlogs OAuth before production
        run: python scripts/channel_oauth_preflight.py --channel tiger

      - name: Check installed Python dependency consistency
        run: python -m pip check

      - name: Execute TigerVlogs-2026 Daily Batch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YT_BRAIN: ${{ vars.YT_BRAIN || 'on' }}
          TIGERVLOGS_TOKEN_JSON: ${{ secrets.TIGERVLOGS_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          TARGET_DATE="${{ github.event.inputs.target_date }}"
          echo "Executing TigerVlogs-2026 1080p Batch Runner..."
          if [ -n "$TARGET_DATE" ]; then
            python "channels/TigerVlogs-2026/scheduler.py" "$TARGET_DATE"
          else
            python "channels/TigerVlogs-2026/scheduler.py"
          fi

      - name: Commit State / Logs
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "TigerVlogs-2026 Autonomous Bot"
          git add channels/TigerVlogs-2026/ || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(TigerVlogs-2026): automated daily upload run [skip ci]"
            pushed=0
            for i in 1 2 3 4 5; do
              echo "Push attempt $i..."
              git pull --rebase origin main && git push && pushed=1 && break
              sleep $((i * 3))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Failed to push TigerVlogs state after 5 attempts!"
              exit 1
            fi
          else
            echo "No changes to state."
          fi
