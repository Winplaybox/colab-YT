name: EpicBharatSaga Autonomous Scheduler

on:
  schedule:
    # Runs Daily at 13:30 UTC (7:00 PM IST)
    # Produces one Hindu mythology Short and schedules it for 7 PM IST
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      episode_number:
        description: 'Episode number to produce (leave empty = next from state.json)'
        required: false
        default: ''
      quality:
        description: 'Output quality: 1080p, 4k, or 8k'
        required: false
        default: '1080p'
      mode:
        description: 'Publish mode: scheduled, immediate, or render_only'
        required: false
        default: 'scheduled'

permissions:
  contents: write

jobs:
  run_epicbharat_scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-epicbharat-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-epicbharat-pip-

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2 \
            edge-tts \
            moviepy==1.0.3 \
            Pillow \
            requests \
            numpy \
            imageio \
            imageio-ffmpeg \
            huggingface_hub \
            pyttsx3

      - name: Write EpicBharatSaga YouTube Token
        run: |
          mkdir -p channels/EpicBharatSaga/credentials
          echo '${{ secrets.EPICBHARATSAGA_TOKEN_JSON }}' > channels/EpicBharatSaga/token.json
        env:
          EPICBHARATSAGA_TOKEN_JSON: ${{ secrets.EPICBHARATSAGA_TOKEN_JSON }}

      - name: Write HuggingFace Token (optional fallback)
        if: ${{ secrets.HF_TOKEN != '' }}
        run: |
          mkdir -p channels/EpicBharatSaga/credentials
          echo '${{ secrets.HF_TOKEN }}' > channels/EpicBharatSaga/credentials/hf_token.txt

      - name: Determine Episode Number
        id: episode
        run: |
          if [ -n "${{ github.event.inputs.episode_number }}" ]; then
            echo "EP_NUM=${{ github.event.inputs.episode_number }}" >> $GITHUB_OUTPUT
          else
            EP=$(python -c "
          import json
          with open('channels/EpicBharatSaga/state.json') as f:
              s = json.load(f)
          print(s.get('current_episode', 1))
          ")
            echo "EP_NUM=$EP" >> $GITHUB_OUTPUT
          fi
          echo "Episode selected: $EP_NUM"

      - name: Run EpicBharatSaga Pipeline
        env:
          EPICBHARATSAGA_TOKEN_JSON: ${{ secrets.EPICBHARATSAGA_TOKEN_JSON }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          QUALITY="${{ github.event.inputs.quality || '1080p' }}"
          MODE="${{ github.event.inputs.mode || 'scheduled' }}"
          EP="${{ steps.episode.outputs.EP_NUM }}"

          echo "🔱 EpicBharatSaga Episode #$EP | Quality: $QUALITY | Mode: $MODE"
          python channels/EpicBharatSaga/scheduler.py \
            --episode "$EP" \
            --quality "$QUALITY" \
            --mode "$MODE"

      - name: Commit Updated State
        run: |
          git config user.name  "EpicBharatSaga Bot"
          git config user.email "epicbharat.official@gmail.com"
          git add channels/EpicBharatSaga/state.json channels/EpicBharatSaga/stories/ || true
          git diff --cached --quiet || git commit -m "chore(EpicBharatSaga): ep #${{ steps.episode.outputs.EP_NUM }} state update [skip ci]"
          git push origin main || true
