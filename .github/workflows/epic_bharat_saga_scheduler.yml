name: EpicBharatSaga Autonomous Scheduler

on:
  schedule:
    # Runs Daily at 13:30 UTC (7:00 PM IST)
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      episode_number:
        description: 'Episode number to produce (leave empty = next from state.json)'
        required: false
        default: ''
      quality:
        description: 'Output quality: 1080p, 4k, or 8k'
        required: false
        default: '1080p'
      mode:
        description: 'Publish mode: scheduled, immediate, or render_only'
        required: false
        default: 'scheduled'

permissions:
  contents: write

jobs:
  run_epicbharat_scheduler:
    name: Generate & Schedule EpicBharatSaga Episode
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2 \
            edge-tts \
            moviepy==1.0.3 \
            static-ffmpeg \
            Pillow \
            requests \
            numpy \
            imageio \
            imageio-ffmpeg \
            huggingface_hub \
            pyttsx3

      - name: Restore EpicBharatSaga Credentials
        env:
          EPICBHARATSAGA_TOKEN_JSON: ${{ secrets.EPICBHARATSAGA_TOKEN_JSON }}
        run: |
          CHANNEL_DIR="channels/EpicBharatSaga"
          mkdir -p "${CHANNEL_DIR}/credentials"
          if [ -n "$EPICBHARATSAGA_TOKEN_JSON" ]; then
            printf "%s" "$EPICBHARATSAGA_TOKEN_JSON" > "${CHANNEL_DIR}/token.json"
            echo "EpicBharatSaga YouTube token installed."
          else
            echo "EPICBHARATSAGA_TOKEN_JSON secret is empty or not set!"
            exit 1
          fi

      - name: Write HuggingFace Token (optional)
        if: ${{ secrets.HF_TOKEN != '' }}
        run: |
          printf "%s" "${{ secrets.HF_TOKEN }}" > channels/EpicBharatSaga/credentials/hf_token.txt

      - name: Determine Episode Number
        id: episode
        run: |
          if [ -n "${{ github.event.inputs.episode_number }}" ]; then
            EP_NUM="${{ github.event.inputs.episode_number }}"
          else
            EP_NUM=$(python -c "
import json
with open('channels/EpicBharatSaga/state.json') as f:
    s = json.load(f)
print(s.get('current_episode', 1))
")
          fi
          echo "EP_NUM=${EP_NUM}" >> $GITHUB_OUTPUT
          echo "Episode selected: ${EP_NUM}"

      - name: Run EpicBharatSaga Pipeline
        env:
          EPICBHARATSAGA_TOKEN_JSON: ${{ secrets.EPICBHARATSAGA_TOKEN_JSON }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          QUALITY="${{ github.event.inputs.quality || '1080p' }}"
          MODE="${{ github.event.inputs.mode || 'scheduled' }}"
          EP="${{ steps.episode.outputs.EP_NUM }}"

          echo "EpicBharatSaga Episode #${EP} | Quality: ${QUALITY} | Mode: ${MODE}"
          python channels/EpicBharatSaga/scheduler.py \
            --episode "${EP}" \
            --quality "${QUALITY}" \
            --mode "${MODE}"

      - name: Upload Output Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epicbharat-episodes
          path: |
            channels/EpicBharatSaga/output/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit Updated State
        if: always()
        run: |
          git config --local user.name  "EpicBharatSaga Bot"
          git config --local user.email "epicbharat.official@gmail.com"
          git add channels/EpicBharatSaga/state.json channels/EpicBharatSaga/stories/ || true
          git diff --staged --quiet || git commit -m "chore(EpicBharatSaga): ep #${{ steps.episode.outputs.EP_NUM }} state update [skip ci]"
          git push || echo "Push skipped."
