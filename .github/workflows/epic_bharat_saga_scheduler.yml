name: EpicBharatSaga Autonomous Scheduler

on:
  # Daily schedule removed: EpicBharatSaga now publishes from Winplaybox/Remotion
  # (publish-channels.yml, 19:00 IST, new paper-diorama format). Manual runs still work.
  workflow_dispatch:
    inputs:
      episode_number:
        description: 'Episode number to produce (leave empty = next from state.json)'
        required: false
        default: ''
      quality:
        description: 'Output quality: 1080p (fast & efficient), 4k (2160x3840), or 8k (4320x7680)'
        required: false
        default: '1080p'
      mode:
        description: 'Publish mode: scheduled, immediate, or render_only'
        required: false
        default: 'scheduled'

permissions:
  contents: write

concurrency:
  group: epic-bharat-saga
  cancel-in-progress: false

jobs:
  # =========================================================================
  # STAGE 1: Mythology Visual Assets & Story Script Generation
  # =========================================================================
  prepare-assets:
    name: "Stage 1: Generate AI Mythological Assets"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install edge-tts requests huggingface_hub pillow google-genai openai anthropic
          fi

      - name: Pre-Generate Mythological Episode & Visuals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          EP_INPUT="${{ github.event.inputs.episode_number }}"
          python -c "
          import sys, os, json
          sys.path.insert(0, 'channels/EpicBharatSaga')
          from story_generator import get_or_create_story
          from image_generator import ensure_story_assets

          ep = int('$EP_INPUT') if '$EP_INPUT'.isdigit() else None
          if not ep:
              try:
                  with open('channels/EpicBharatSaga/state.json', 'r') as f:
                      st = json.load(f)
                      ep = st.get('current_episode', 1)
              except Exception:
                  ep = 1

          print(f'Stage 1: Generating assets for Episode #{ep}...')
          story = get_or_create_story(ep)
          ensure_story_assets(ep)
          print('✅ Mythological assets prepared successfully.')
          "

      - name: Upload Mythological Assets
        uses: actions/upload-artifact@v4
        with:
          name: epicbharat-assets
          path: |
            channels/EpicBharatSaga/stories/assets/
          if-no-files-found: ignore
          retention-days: 1

  # =========================================================================
  # STAGE 2: Video Composite & YouTube Scheduling
  # =========================================================================
  render-and-schedule:
    name: "Stage 2: Video Composite & YouTube Scheduling"
    needs: prepare-assets
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Global Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install yt-dlp edge-tts google-api-python-client google-auth-oauthlib google-auth-httplib2 requests static-ffmpeg huggingface_hub pillow google-genai openai anthropic
          fi

      - name: Download Stage 1 Mythological Assets
        uses: actions/download-artifact@v4
        with:
          name: epicbharat-assets
          path: channels/EpicBharatSaga/stories/

      - name: Restore EpicBharatSaga Credentials
        env:
          EPICBHARATSAGA_TOKEN_JSON: ${{ secrets.EPICBHARATSAGA_TOKEN_JSON }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          CHANNEL_DIR="channels/EpicBharatSaga"
          mkdir -p "${CHANNEL_DIR}/credentials"
          if [ -n "$EPICBHARATSAGA_TOKEN_JSON" ]; then
            printf "%s" "$EPICBHARATSAGA_TOKEN_JSON" > "${CHANNEL_DIR}/token.json"
            echo "EpicBharatSaga YouTube token installed."
          else
            echo "EPICBHARATSAGA_TOKEN_JSON secret is empty or not set!"
            exit 1
          fi
          if [ -n "$HF_TOKEN" ]; then
            printf "%s" "$HF_TOKEN" > "${CHANNEL_DIR}/credentials/hf_token.txt"
          fi

      - name: Run EpicBharatSaga Pipeline
        env:
          EPICBHARATSAGA_TOKEN_JSON: ${{ secrets.EPICBHARATSAGA_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YT_BRAIN: ${{ vars.YT_BRAIN || 'on' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          QUALITY="${{ github.event.inputs.quality || '1080p' }}"
          MODE="${{ github.event.inputs.mode || 'scheduled' }}"
          EP_INPUT="${{ github.event.inputs.episode_number }}"

          EP_ARG=""
          if [ -n "$EP_INPUT" ]; then
            EP_ARG="--episode $EP_INPUT"
          fi

          echo "🔱 EpicBharatSaga Pipeline | Quality: ${QUALITY} | Mode: ${MODE} | Episode: ${EP_INPUT:-auto}"
          python channels/EpicBharatSaga/scheduler.py \
            --quality "$QUALITY" \
            --mode "$MODE" \
            $EP_ARG

      - name: Upload Output Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epicbharat-episodes
          path: channels/EpicBharatSaga/output/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit State Changes
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "EpicBharatSaga Bot"
          git add channels/EpicBharatSaga/state.json channels/EpicBharatSaga/stories/ || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(EpicBharatSaga): advance episode state [skip ci]"
            pushed=0
            for i in 1 2 3 4 5; do
              echo "Push attempt $i..."
              git pull --rebase origin main && git push && pushed=1 && break
              sleep $((i * 3))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Failed to push EpicBharatSaga state after 5 attempts!"
              exit 1
            fi
          else
            echo "No changes to state."
          fi
