name: MindNest Tales Multi-Language 11-Channel Scheduler

on:
  schedule:
    # Autonomous batch release on Wednesday, Saturday, Sunday at 02:00 UTC (7:30 AM IST)
    - cron: '0 2 * * 0,3,6'
  workflow_dispatch:
    inputs:
      story_number:
        description: 'Story number to produce and schedule (1 - 51, or empty for next)'
        required: false
        default: 'auto'
      target_language:
        description: 'Target language (all = run all 11 channels sequentially, or hi, en, es, pt, fr, de, ar, ja, ko, vi, fil)'
        required: false
        default: 'all'
      quality:
        description: 'Output quality: 1080p (fast & efficient), 4k (2160x3840), or 8k (4320x7680)'
        required: false
        default: '1080p'
      release_mode:
        description: 'Release mode: dual (10-min + short trailer), short (180s short only), or long (10-min only)'
        required: false
        default: 'dual'

permissions:
  contents: write

concurrency:
  group: mindnest-tales
  cancel-in-progress: false

jobs:
  # =========================================================================
  # Render & Upload Across Target Channels (max-parallel: 1 to avoid state collisions)
  # =========================================================================
  render-and-publish:
    name: ${{ matrix.language.name }} (${{ matrix.language.code }}) Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        language:
          - code: hi
            name: "Hindi"
            token_secret: MINDNEST_TOKEN_HI_JSON
          - code: en
            name: "English"
            token_secret: MINDNEST_TOKEN_EN_JSON
          - code: es
            name: "Spanish"
            token_secret: MINDNEST_TOKEN_ES_JSON
          - code: pt
            name: "Portuguese"
            token_secret: MINDNEST_TOKEN_PT_JSON
          - code: fr
            name: "French"
            token_secret: MINDNEST_TOKEN_FR_JSON
          - code: de
            name: "German"
            token_secret: MINDNEST_TOKEN_DE_JSON
          - code: ar
            name: "Arabic"
            token_secret: MINDNEST_TOKEN_AR_JSON
          - code: ja
            name: "Japanese"
            token_secret: MINDNEST_TOKEN_JA_JSON
          - code: ko
            name: "Korean"
            token_secret: MINDNEST_TOKEN_KO_JSON
          - code: vi
            name: "Vietnamese"
            token_secret: MINDNEST_TOKEN_VI_JSON
          - code: fil
            name: "Filipino"
            token_secret: MINDNEST_TOKEN_FIL_JSON

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Filter (Skip if specific language requested)
        id: filter-check
        run: |
          REQ_LANG="${{ github.event.inputs.target_language || 'all' }}"
          CURR_LANG="${{ matrix.language.code }}"
          if [ "$REQ_LANG" != "all" ] && [ "$REQ_LANG" != "$CURR_LANG" ]; then
            echo "Skipping ${CURR_LANG} because user requested: ${REQ_LANG}"
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python 3.11
        if: steps.filter-check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Global Multi-Language Fonts)
        if: steps.filter-check.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk libraqm0 libraqm-dev fonts-dejavu-core

      - name: Install Python Dependencies
        if: steps.filter-check.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install yt-dlp edge-tts google-api-python-client google-auth-oauthlib google-auth-httplib2 gspread requests pandas static-ffmpeg pillow arabic-reshaper python-bidi huggingface_hub google-genai openai anthropic
          fi

      - name: Restore Channel Credentials
        if: steps.filter-check.outputs.should_run == 'true'
        env:
          MINDNEST_TOKEN: ${{ secrets.MINDNEST_TOKEN_JSON }}
          MINDNEST_SECRET: ${{ secrets.MINDNEST_CLIENT_SECRET_JSON }}
          FALLBACK_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          LANG_TOKEN: ${{ secrets[matrix.language.token_secret] }}
        run: |
          CHANNEL_DIR="channels/MindNestTales"
          CREDS_DIR="${CHANNEL_DIR}/credentials"
          mkdir -p "${CREDS_DIR}"

          # Master token for MindNest Tales
          if [ -n "$MINDNEST_TOKEN" ]; then
            printf "%s" "$MINDNEST_TOKEN" > "${CHANNEL_DIR}/token.json"
          fi

          # Language specific token
          if [ -n "$LANG_TOKEN" ]; then
            printf "%s" "$LANG_TOKEN" > "${CREDS_DIR}/token_${{ matrix.language.code }}.json"
            echo "Installed dedicated token for ${{ matrix.language.name }}."
          fi

          SECRET_DATA="${MINDNEST_SECRET:-$FALLBACK_SECRET}"
          if [ -n "$SECRET_DATA" ]; then
            printf "%s" "$SECRET_DATA" > "${CHANNEL_DIR}/youtube_client_secret.json"
          fi

      - name: Execute Story Pipeline for ${{ matrix.language.name }}
        if: steps.filter-check.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YT_BRAIN: ${{ vars.YT_BRAIN || 'on' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          MINDNEST_TOKEN_JSON: ${{ secrets.MINDNEST_TOKEN_JSON }}
        run: |
          STORY_NUM="${{ github.event.inputs.story_number }}"
          QUALITY="${{ github.event.inputs.quality || '1080p' }}"
          MODE="${{ github.event.inputs.release_mode || 'dual' }}"

          STORY_ARG="${STORY_NUM:-auto}"
          LANG_ARG="${{ matrix.language.code }}"

          echo "🚀 Running: ${{ matrix.language.name }} | Story: ${STORY_ARG} | Quality: ${QUALITY} | Mode: ${MODE}"
          python "channels/MindNestTales/scheduler.py" "$STORY_ARG" "$LANG_ARG" "$QUALITY" "$MODE"

      - name: Commit State / Logs Safely
        if: success() && steps.filter-check.outputs.should_run == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "MindNest Tales Autonomous Bot"
          git add channels/MindNestTales/state.json channels/MindNestTales/stories/ || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(MindNestTales): automated release run [${{ matrix.language.code }}] [skip ci]"
            pushed=0
            for i in 1 2 3 4 5; do
              echo "Push attempt $i..."
              git pull --rebase origin main && git push && pushed=1 && break
              sleep $((i * 3))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Failed to push MindNestTales state after 5 attempts!"
              exit 1
            fi
          else
            echo "No changes to state."
          fi
