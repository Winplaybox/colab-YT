name: BuzzStormNow Autonomous 3-Posts/Day Blog Publisher

on:
  schedule:
    # 3 Optimal Indian Market & Global Financial Posting Windows:
    # 1. Morning Bell & Pre-Market Setup: 08:15 AM IST = 02:45 UTC
    - cron: '45 2 * * *'
    # 2. Mid-Day Movers & Board Actions:  01:00 PM IST = 07:30 UTC
    - cron: '30 7 * * *'
    # 3. Closing Bell Wrap & Tomorrow's Radar: 05:30 PM IST = 12:00 UTC
    - cron: '0 12 * * *'

  workflow_dispatch:
    inputs:
      execution_mode:
        description: 'Execution Mode: auto (picks slot by current IST time), post_now (1 instant post), batch (all 3 daily posts), or preview (dry run)'
        required: true
        default: 'auto'
      draft_only:
        description: 'Publish as Draft? (true = draft only, false = live publish)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  publish-buzzstorm-post:
    name: Ingest, Rewrite & Publish Viral Post
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-cjk

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests Pillow google-api-python-client google-auth-oauthlib google-auth-httplib2
          fi

      - name: Restore Blogger Credentials
        env:
          BLOGGER_TOKEN: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
          FALLBACK_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          mkdir -p blog/credentials
          if [ -n "$BLOGGER_TOKEN" ]; then
            printf "%s" "$BLOGGER_TOKEN" > "blog/credentials/blogger_token.json"
            echo "✅ Installed Blogger OAuth token."
          else
            echo "⚠️ Notice: BLOGGER_TOKEN_JSON secret not set. The engine will generate and save local drafts."
          fi

          SECRET_DATA="${BLOGGER_SECRET:-$FALLBACK_SECRET}"
          if [ -n "$SECRET_DATA" ]; then
            printf "%s" "$SECRET_DATA" > "blog/credentials/client_secret.json"
          fi

      - name: Validate Blogger OAuth before content generation
        run: python scripts/channel_oauth_preflight.py --channel buzzstorm

      - name: Check installed Python dependency consistency
        run: python -m pip check

      - name: Execute BuzzStormNow Lead Editor & Publisher
        run: |
          MODE="${{ github.event.inputs.execution_mode }}"
          DRAFT="${{ github.event.inputs.draft_only }}"
          
          EXEC_MODE="${MODE:-auto}"
          if [ "$DRAFT" = "true" ]; then
            EXEC_MODE="draft"
          fi

          echo "🚀 Running BuzzStormNow Lead Editor [Mode: $EXEC_MODE]..."
          python blog/scheduler.py "$EXEC_MODE"

      - name: Commit Updated Archive & Drafts
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "BuzzStormNow Automation Bot"
          git add blog/data/published_archive.json blog/data/drafts/ || true
          git diff --staged --quiet || git commit -m "chore(BuzzStormNow): update published archive and drafts [skip ci]"
          git push || echo "Push skipped or no new changes to push."
