channel: digital-immortals
display_name: Digital Immortals
format: short            # short = 9:16 <60s portrait Shorts

script:
  min_words: 110
  max_words: 150         # ~50-58 sec
  hook_max_words: 12     # pehli line
  max_line_chars: 160
  end_with_question: true
  style: |
    Narrative: Sanatan Dharma, Hindu Mythology, ancient secrets, Chiranjeevi, Mahabharata & Ramayana lore.
    Pehli line = seedha ek aashcharyajanak ya anokha rahasya jo viewer ko baandh le.
    Tone: Gambhir, shaant, rochak aur bhakti bhav se bhara hua.
    Chhote aur spasht vaakya.
    Har 2-3 line mein ek naya historical/mythological detail.
    Ending twist ya contemplative conclusion; aakhri line comment-provoking question (e.g. क्या अश्वत्थामा आज भी जीवित हैं?).
    Respectful towards sacred traditions, zero controversial distortion.
  banned:
    - "नमस्ते दोस्तों"
    - "लाइक"
    - "सब्सक्राइब"
    - "इस वीडियो में"
    - "आज हम"

voice:
  ref_wav: channels/digital-immortals/ref.wav
  ref_txt: channels/digital-immortals/ref.txt
  gap_ms: 250

subs:
  words_per_cue: 4

video:
  width: 1080
  height: 1920
  fps: 30
  bg_dir: channels/digital-immortals/bg
  music: channels/digital-immortals/music.mp3
  music_db: -20
  bg_brightness: -0.05
  sub_style: "FontName=Noto Sans Devanagari,FontSize=14,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=2,Alignment=2,MarginV=110"

metadata:
  language: Hinglish (Roman script)
  title_max_chars: 70

publish:
  mode: schedule
  slots_ist: ["05:00", "18:00"]
  min_lead_hours: 3
  category_id: "24"       # Entertainment
  synthetic_media: true
  made_for_kids: false
  hashtags: ["#digitalimmortals", "#hindumythology", "#sanatandharma", "#shorts"]
  default_tags: ["hindu mythology", "mahabharat mystery", "chiranjeevi secrets", "ramayana facts", "sanatan dharma"]

ideas:
  refill_below: 5
  batch_size: 20
  themes: ["chiranjeevi", "ashwatthama", "hanuman ji", "kalki avatar", "divya astra", "vedic science", "mahabharata secrets", "parashurama", "kailash parvat", "ancient temples"]
