<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- "Amar" — Digital Immortals narrator. Flat style, fixed design. -->
  <!-- ground shadow -->
  <ellipse cx="300" cy="768" rx="170" ry="22" fill="#000" opacity="0.25"/>

  <!-- body: saffron kurta -->
  <path d="M170 500 Q300 450 430 500 L470 760 Q300 790 130 760 Z" fill="#F28C28"/>
  <path d="M300 470 L300 770" stroke="#D9701A" stroke-width="6"/>
  <!-- sash -->
  <path d="M190 505 L250 495 L420 760 L360 768 Z" fill="#B83227"/>
  <!-- rudraksha mala -->
  <g fill="#6B3A1E">
    <circle cx="232" cy="500" r="9"/><circle cx="246" cy="522" r="9"/><circle cx="262" cy="542" r="9"/>
    <circle cx="281" cy="556" r="9"/><circle cx="300" cy="561" r="10"/><circle cx="319" cy="556" r="9"/>
    <circle cx="338" cy="542" r="9"/><circle cx="354" cy="522" r="9"/><circle cx="368" cy="500" r="9"/>
  </g>

  <!-- left arm holding scroll -->
  <path d="M178 520 Q120 600 160 660" stroke="#F28C28" stroke-width="54" fill="none" stroke-linecap="round"/>
  <circle cx="165" cy="668" r="30" fill="#E8A86B"/>
  <rect x="120" y="640" width="120" height="44" rx="10" fill="#F6E3B4" stroke="#C9A14A" stroke-width="5"/>
  <circle cx="122" cy="662" r="22" fill="#E9CF8E" stroke="#C9A14A" stroke-width="5"/>
  <circle cx="238" cy="662" r="22" fill="#E9CF8E" stroke="#C9A14A" stroke-width="5"/>

  <!-- right arm raised, open palm (abhaya mudra / blessing) -->
  <path d="M422 520 Q500 480 505 400" stroke="#F28C28" stroke-width="54" fill="none" stroke-linecap="round"/>
  <g fill="#E8A86B">
    <rect x="474" y="318" width="64" height="74" rx="26"/>
    <rect x="474" y="268" width="15" height="66" rx="7.5"/>
    <rect x="491" y="258" width="15" height="74" rx="7.5"/>
    <rect x="508" y="262" width="15" height="70" rx="7.5"/>
    <rect x="525" y="276" width="14" height="58" rx="7"/>
    <rect x="452" y="342" width="34" height="15" rx="7.5" transform="rotate(-35 469 349)"/>
  </g>
  <path d="M488 372 Q506 380 524 372" stroke="#C9844F" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- neck -->
  <rect x="270" y="400" width="60" height="70" fill="#D9935A"/>

  <!-- ears -->
  <circle cx="160" cy="280" r="30" fill="#E8A86B"/>
  <circle cx="440" cy="280" r="30" fill="#E8A86B"/>
  <circle cx="160" cy="300" r="7" fill="#F2C94C"/>
  <circle cx="440" cy="300" r="7" fill="#F2C94C"/>

  <!-- head -->
  <circle cx="300" cy="270" r="148" fill="#E8A86B"/>

  <!-- hair cap + shikha topknot -->
  <path d="M155 250 Q160 110 300 105 Q440 110 445 250 Q420 175 300 170 Q180 175 155 250 Z" fill="#2B1B12"/>
  <circle cx="300" cy="92" r="40" fill="#2B1B12"/>
  <rect x="268" y="118" width="64" height="16" rx="8" fill="#F2C94C"/>

  <!-- tilak -->
  <path d="M286 188 L300 232 L314 188" stroke="#F28C28" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="300" cy="240" r="8" fill="#C0392B"/>

  <!-- eyebrows -->
  <path d="M215 238 Q245 222 272 236" stroke="#2B1B12" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M328 236 Q355 222 385 238" stroke="#2B1B12" stroke-width="9" fill="none" stroke-linecap="round"/>

  {EYES}

  <!-- cheeks -->
  <ellipse cx="208" cy="330" rx="26" ry="15" fill="#E7765B" opacity="0.55"/>
  <ellipse cx="392" cy="330" rx="26" ry="15" fill="#E7765B" opacity="0.55"/>

  <!-- nose -->
  <path d="M296 300 Q290 318 302 322" stroke="#C9844F" stroke-width="6" fill="none" stroke-linecap="round"/>

  {MOUTH}
</svg>
